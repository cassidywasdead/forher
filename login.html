<!DOCTYPE html>
<html>
<head>
<title>Login ❤️</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
</head>

<body style="background:black;color:white;text-align:center;padding-top:150px;">

<h2>Enter Password ❤️</h2>

<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBpe5zKexLQ_K3Pe_Lz_fhszFcz-d8BbJ4",
  authDomain: "for-her-92dfe.firebaseapp.com",
  projectId: "for-her-92dfe",
  storageBucket: "for-her-92dfe.firebasestorage.app",
  messagingSenderId: "767762686586",
  appId: "1:767762686586:web:49597b656205c67c38d1c3",
  measurementId: "G-EEQCV8EGHJ"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, pass)
    .then(()=>{
      window.location.href = "index.html";
    })
    .catch(()=>{
      alert("Wrong email or password 😡");
    });
}
</script>

</body>
</html>
