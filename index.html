<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Lovleen ❤️</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  font-family: Arial, sans-serif;
}

/* BACKGROUND */
body{
  background:
    linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.6)),
    url("bg1.jpg") no-repeat center center fixed;
  background-size:cover;
  color:white;
  text-align:center;
}

/* TEXT */
h1{
  margin-top:20px;
  text-shadow:0 0 15px pink;
  position:relative;
  z-index:2;
}

/* CANVAS FIREWORKS */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

/* ROSE PETALS */
.petal{
  position:fixed;
  top:-50px;
  pointer-events:none;
  z-index:2;
  animation-name:fall;
  animation-timing-function:linear;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<h1>Every piece still shows you ❤️</h1>

<canvas id="canvas"></canvas>
<audio id="fireSound" src="fireworks1.mp3" preload="auto"></audio>

<script>
// ===== FIREWORK SYSTEM (YOUR CODE) =====
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;
onresize=()=>{canvas.width=innerWidth;canvas.height=innerHeight;}

const audio = document.getElementById("fireSound");
audio.volume = 1;

// SOUND LOOP
function startSoundLoop(){
  audio.currentTime = 0;
  audio.play();
  setInterval(()=>{
    audio.currentTime = 0;
    audio.play();
  },3800);
}

let fireworks=[];

function randomColor(){
  const colors=["red","yellow","lime","cyan","orange","violet","white","blue"];
  return colors[Math.floor(Math.random()*colors.length)];
}

function createFirework(x,y){
  const color = randomColor();
  let particles=[];
  for(let i=0;i<200;i++){
    const angle=(Math.PI*2*i)/200;
    const speed=Math.random()*6+3;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      alpha:1,
      color
    });
  }
  fireworks.push(particles);
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  fireworks.forEach((fw,fi)=>{
    fw.forEach(p=>{
      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=0.03;
      p.alpha-=0.01;
      ctx.globalAlpha=p.alpha;
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.2,0,Math.PI*2);
      ctx.fillStyle=p.color;
      ctx.fill();
    });
    fireworks[fi]=fw.filter(p=>p.alpha>0);
  });

  fireworks=fireworks.filter(fw=>fw.length>0);
  requestAnimationFrame(animate);
}
animate();

function startFireworks(){
  setInterval(()=>{
    let y = Math.random()*canvas.height*0.5+100;
    createFirework(canvas.width*0.3,y);
    createFirework(canvas.width*0.7,y);
  },1200);
}

// ===== ROSE PETALS =====
function createPetal(){
  const p=document.createElement("img");
  p.src="rosepetal.PNG";   // EXACT NAME
  p.className="petal";

  p.style.left=Math.random()*100+"vw";

  const size=Math.random()*20+15;
  p.style.width=size+"px";
  p.style.height=size+"px";

  p.style.animationDuration=(Math.random()*5+6)+"s";

  document.body.appendChild(p);
  setTimeout(()=>p.remove(),10000);
}
setInterval(createPetal,200);

// AUTO START
startSoundLoop();
startFireworks();
</script>

</body>
</html>
