<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Lovleen ❤️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)),
    url("bg1.jpg") no-repeat center center fixed;
  background-size: cover;
  overflow-x: hidden;
  font-family: Segoe UI, sans-serif;
  color: white;
  text-align: center;
}

canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

h1 { margin-top:20px; text-shadow:0 0 15px pink; }

#gallery {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:15px;
  padding:30px;
}

.tile {
  width:90px;height:90px;
  background-size:cover;
  background-position:center;
}

.circle{border-radius:50%}
.heart{clip-path:path("M45 15 C45 -5, 0 -5, 0 25 C0 55, 45 80, 45 80 C45 80, 90 55, 90 25 C90 -5, 45 -5, 45 15 Z")}
.hexagon{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%)}

.petal {
  position: fixed;
  top: -50px;
  width: 30px;
  pointer-events:none;
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translate(var(--wind), 110vh) rotate(360deg); }
}
</style>
</head>

<body>

<canvas id="fw"></canvas>

<h1>Every piece still shows you ❤️</h1>
<div id="gallery"></div>

<div>
I love you lovleen ❤️<br><br>
<b>Will you be mine forever?</b>
</div>

<button id="yes">YES 💖</button>
<button id="no">NO 🙄</button>
<div id="msg"></div>

<audio id="boom" src="fireworks1.mp3" loop></audio>

<script>
/* gallery */
const gallery=document.getElementById("gallery");
const shapes=["circle","heart","hexagon"];
for(let i=1;i<=77;i++){
 let d=document.createElement("div");
 d.className="tile "+shapes[i%3];
 d.style.backgroundImage=`url("Zip-${i}.jpg")`;
 gallery.appendChild(d);
}

/* rose petals */
function petal(){
 let p=document.createElement("img");
 p.src="rosepetal.png";
 p.className="petal";
 p.style.left=Math.random()*100+"vw";
 p.style.width=Math.random()*20+20+"px";
 p.style.opacity=Math.random();
 p.style.animationDuration=Math.random()*4+6+"s";
 p.style.setProperty("--wind",(Math.random()*200-100)+"px");
 document.body.appendChild(p);
 setTimeout(()=>p.remove(),12000);
}
setInterval(petal,300);

/* fireworks canvas */
const canvas=document.getElementById("fw");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;canvas.height=innerHeight;
let particles=[];

function boom(){
 let x=Math.random()*canvas.width;
 let y=Math.random()*canvas.height*0.5;
 for(let i=0;i<60;i++){
  particles.push({
   x,y,
   vx:(Math.random()-0.5)*6,
   vy:(Math.random()-0.5)*6,
   life:100,
   color:`hsl(${Math.random()*360},100%,60%)`
  });
 }
}

function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 particles.forEach((p,i)=>{
  p.x+=p.vx; p.y+=p.vy; p.life--;
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,3,0,Math.PI*2);
  ctx.fill();
  if(p.life<=0) particles.splice(i,1);
 });
 requestAnimationFrame(animate);
}
animate();

document.getElementById("yes").onclick=()=>{
 document.getElementById("boom").play();
 setInterval(boom,600);
};

document.getElementById("no").onclick=()=>{
 document.getElementById("msg").innerText="❌ Option not available 😎";
};
</script>

</body>
</html>
