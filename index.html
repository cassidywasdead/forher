<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Lovleen ❤️</title>

<style>
/* --- BASE STYLES --- */
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), url("bg1.jpg") no-repeat center center fixed;
  background-size: cover;
  overflow-x: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  text-align: center;
  user-select: none; /* Text selection disable kar diya taaki look kharab na ho */
}

h1 {
  margin-top: 20px;
  text-shadow: 0 0 15px pink;
  font-size: 2rem;
  position: relative;
  z-index: 2;
}

/* --- GALLERY GRID --- */
#gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 15px;
  padding: 30px;
  justify-items: center;
  position: relative;
  z-index: 2;
}

.tile {
  width: 90px;
  height: 90px;
  background-size: cover;
  background-position: center;
  transition: transform 0.3s;
}
.tile:hover { transform: scale(1.1); }

/* Shapes */
.circle { border-radius: 50%; }
.heart { clip-path: path("M45 15 C45 -5,0 -5,0 25 C0 55,45 80,45 80 C45 80,90 55,90 25 C90 -5,45 -5,45 15 Z"); }
.hexagon { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }

/* --- TEXT & BUTTONS --- */
#text {
  margin: 40px 20px;
  font-size: 20px;
  text-shadow: 0 0 10px pink;
  position: relative;
  z-index: 2;
  background: rgba(0,0,0,0.3); /* Thoda dark background text ke peeche readability ke liye */
  padding: 20px;
  border-radius: 15px;
  display: inline-block;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  margin: 15px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  position: relative;
  z-index: 2;
  transition: transform 0.2s;
}
button:active { transform: scale(0.95); }

#yes { background: hotpink; color: white; box-shadow: 0 0 15px hotpink; }
#no { background: #333; color: white; }

#msg {
  font-size: 22px;
  margin-top: 20px;
  color: pink;
  position: relative;
  z-index: 2;
  font-weight: bold;
}

/* --- POPUP --- */
#popup {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10;
}
#popupBox {
  backdrop-filter: blur(10px);
  background: rgba(255,182,193,0.2);
  border: 2px solid pink;
  border-radius: 20px;
  padding: 30px;
  width: 90%;
  max-width: 300px;
  box-shadow: 0 0 30px pink;
  text-align: center;
}
#popupBox p { font-size: 1.2rem; margin-bottom: 20px; }
#popupBox button { width: 100%; margin: 0; }

/* --- CANVAS (Fireworks) --- */
canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1; /* Background ke upar, content ke neeche */
}

/* --- PETALS (Falling Images) --- */
.petal {
  position: fixed;
  top: -50px;
  pointer-events: none;
  z-index: 999; /* Sabse upar girenge */
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translate(var(--wind), 110vh) rotate(360deg); }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<h1>Every piece still shows you ❤️</h1>

<div id="gallery"></div>

<div id="text">
  I have my eyes on you since the very first day of your on earth ie 28nov2009 🐣<br>
  I love you lovleen ❤️🙈<br><br>
  <b>Will you be mine forever?</b>
</div>

<div>
  <button id="yes">YES 💖</button>
  <button id="no">NO 🙄</button>
</div>

<div id="msg"></div>

<div id="popup">
  <div id="popupBox">
    <p>Thank you for loving me, I love you ❤️</p>
    <button onclick="closePopup()">I love you more 💖</button>
  </div>
</div>

<audio id="fireSound" src="fireworks1.mp3"></audio>

<script>
/* ================= GALLERY LOGIC ================= */
const gallery = document.getElementById("gallery");
const shapes = ["circle", "heart", "hexagon"];

for (let i = 1; i <= 77; i++) {
  const d = document.createElement("div");
  d.className = "tile " + shapes[i % 3];
  d.style.backgroundImage = `url("Zip-${i}.jpg")`;
  
  // Add fallback if image fails (optional safety)
  d.onerror = function() { this.style.backgroundColor = "pink"; }
  
  gallery.appendChild(d);
}

/* ================= PETALS LOGIC (From Code 2) ================= */
function createPetal() {
  const p = document.createElement("img");
  p.src = "rosepetal.PNG"; // Ensure this file exists!
  p.className = "petal";
  p.style.left = Math.random() * 100 + "vw";
  p.style.width = Math.random() * 20 + 20 + "px"; // Size between 20px and 40px
  p.style.opacity = Math.random() * 0.5 + 0.5; // Random opacity
  
  // Animation duration
  const duration = Math.random() * 4 + 6; // Between 6s and 10s
  p.style.animationDuration = duration + "s";
  
  // Wind effect variable
  const wind = (Math.random() * 200 - 100) + "px";
  p.style.setProperty("--wind", wind);
  
  document.body.appendChild(p);
  
  // Remove after animation
  setTimeout(() => p.remove(), duration * 1000);
}

// Start petals falling immediately
setInterval(createPetal, 300);


/* ================= BUTTONS & POPUP ================= */
const audio = document.getElementById("fireSound");

document.getElementById("no").onclick = () => {
  const msg = document.getElementById("msg");
  msg.innerText = "❌ Option not available, try harder NCC babe 😎";
  
  // Shake effect for 'No'
  msg.style.transform = "translateX(10px)";
  setTimeout(() => msg.style.transform = "translateX(0)", 100);
};

document.getElementById("yes").onclick = () => {
  document.getElementById("popup").style.display = "flex";
  
  // Vibrate phone
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  
  // Play sound
  startSoundLoop();
  
  // Start Fireworks
  startFireworks();
};

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

function startSoundLoop() {
  audio.currentTime = 0;
  audio.play().catch(e => console.log("Audio play needs interaction"));
  // Loop sound every 3.8s roughly matches firework intensity
  setInterval(() => {
    audio.currentTime = 0;
    audio.play();
  }, 3800);
}

/* ================= FIREWORKS LOGIC (From Code 1 - Gravity Based) ================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.onresize = () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
};

let fireworks = [];

function randomColor() {
  const c = ["#ff0040", "#ff00ff", "#00ffff", "#ffff00", "#ff8000", "#ffffff"];
  return c[Math.floor(Math.random() * c.length)];
}

function createFirework(x, y) {
  const color = randomColor();
  let particles = [];
  for (let i = 0; i < 150; i++) { // 150 particles per explosion
    const angle = (Math.PI * 2 * i) / 150;
    const speed = Math.random() * 6 + 2; // Random speed
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1,
      color: color,
      gravity: 0.05 // Gravity makes them fall
    });
  }
  fireworks.push(particles);
}

function animateFireworks() {
  // Clear with a tiny bit of transparency trails (optional, but clean clear is safer)
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  fireworks.forEach((fw, index) => {
    fw.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity; // Apply gravity
      p.alpha -= 0.01;   // Fade out
      
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });
    
    // Remove faded particles
    fireworks[index] = fw.filter(p => p.alpha > 0);
  });
  
  // Remove empty fireworks
  fireworks = fireworks.filter(fw => fw.length > 0);
  requestAnimationFrame(animateFireworks);
}

// Start animation loop
animateFireworks();

function startFireworks() {
  // Create multiple fireworks at random positions
  setInterval(() => {
    let x = Math.random() * canvas.width * 0.8 + (canvas.width * 0.1); // Keep within 10-90% width
    let y = Math.random() * canvas.height * 0.5 + 100; // Top half
    createFirework(x, y);
    
    // Create a second one occasionally
    if(Math.random() > 0.5) {
       createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.4);
    }
  }, 1000);
}
</script>

</body>
</html>
