<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Her ❤️</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)),
    url("bg1.jpg") no-repeat center center fixed;
  background-size:cover;
  font-family:Arial, sans-serif;
  color:white;
}

/* text */
#text{
  position:fixed;
  top:20px;
  width:100%;
  text-align:center;
  font-size:24px;
  text-shadow:0 0 15px pink;
  z-index:5;
}

/* canvas */
canvas{
  display:block;
  position:fixed;
  inset:0;
  z-index:1;
}

/* 🌹 petals */
.petal{
  position:fixed;
  top:-40px;
  pointer-events:none;
  z-index:4;
  animation: fall linear forwards;
}

@keyframes fall{
  to{
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div id="text">Every piece still shows you ❤️</div>

<canvas id="canvas"></canvas>
<audio id="fireSound" src="fireworks1.mp3" preload="auto"></audio>

<script>
/* ================= FIREWORKS ================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;
onresize=()=>{canvas.width=innerWidth;canvas.height=innerHeight;}

const audio = document.getElementById("fireSound");
audio.volume = 1;

// 🔊 sound loop
function startSoundLoop(){
  audio.currentTime = 0;
  audio.play();
  setInterval(()=>{
    audio.currentTime = 0;
    audio.play();
  },3800);
}

// 🎆 system
let fireworks=[];

function randomColor(){
  const colors=["red","yellow","lime","cyan","orange","violet","white","blue"];
  return colors[Math.floor(Math.random()*colors.length)];
}

function createFirework(x,y){
  const color = randomColor();
  let particles=[];
  for(let i=0;i<200;i++){
    const angle=(Math.PI*2*i)/200;
    const speed=Math.random()*6+3;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      alpha:1,
      color
    });
  }
  fireworks.push(particles);
}

function animate(){
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  fireworks.forEach((fw,fi)=>{
    fw.forEach(p=>{
      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=0.03;
      p.alpha-=0.01;
      ctx.globalAlpha=p.alpha;
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.2,0,Math.PI*2);
      ctx.fillStyle=p.color;
      ctx.fill();
    });
    fireworks[fi]=fw.filter(p=>p.alpha>0);
  });

  fireworks=fireworks.filter(fw=>fw.length>0);
  requestAnimationFrame(animate);
}
animate();

// auto fireworks
function startFireworks(){
  setInterval(()=>{
    let y = Math.random()*canvas.height*0.5+100;
    createFirework(canvas.width*0.3,y);
    createFirework(canvas.width*0.7,y);
  },1200);
}

canvas.onclick = e => createFirework(e.clientX,e.clientY);

/* ================= 🌹 PETALS ================= */
function createPetal(){
  const p=document.createElement("img");
  p.src="rosepetal.PNG";   // ⚠️ exact filename
  p.className="petal";
  p.style.left=Math.random()*100+"vw";

  const size=Math.random()*20+15;
  p.style.width=size+"px";
  p.style.height=size+"px";

  p.style.animationDuration=(Math.random()*5+6)+"s";

  document.body.appendChild(p);
  setTimeout(()=>p.remove(),10000);
}
setInterval(createPetal,200);

/* ================= AUTO START ================= */
startSoundLoop();
startFireworks();
</script>

</body>
</html>
