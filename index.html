<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Lovleen ❤️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ff5f9e, #7b2ff7);
  overflow-x: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 20px;
  text-shadow: 0 0 15px #ffb6c1;
}

#gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 15px;
  padding: 30px;
  justify-items: center;
}

.tile {
  width: 90px;
  height: 90px;
  background-size: cover;
  background-position: center;
  transition: 0.3s;
}

.circle { border-radius: 50%; }

.heart {
  clip-path: path("M45 15 C45 -5, 0 -5, 0 25 C0 55, 45 80, 45 80 C45 80, 90 55, 90 25 C90 -5, 45 -5, 45 15 Z");
}

.hexagon {
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
}

.tile:hover {
  transform: scale(1.15);
  box-shadow: 0 0 20px hotpink;
}

#text {
  margin: 40px 20px;
  font-size: 20px;
  text-shadow: 0 0 10px #ffd1dc;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  margin: 15px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: hotpink;
  color: white;
}

#no {
  background: #444;
  color: white;
}

#msg {
  font-size: 22px;
  margin-top: 20px;
  color: #ffe6f0;
}

/* iPhone style popup */
#popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
}

#popupBox {
  background: #f2f2f7;
  color: black;
  width: 280px;
  border-radius: 15px;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont;
  box-shadow: 0 0 20px rgba(255,192,203,0.8);
}

#popupBox h3 {
  margin: 0;
  font-size: 18px;
}

#popupBox p {
  font-size: 14px;
  margin: 10px 0 20px;
}

#popupBox button {
  width: 100%;
  background: #007aff;
  color: white;
  border-radius: 10px;
  padding: 10px;
}
</style>
</head>

<body>

<h1>Every piece still shows you ❤️</h1>

<div id="gallery"></div>

<div id="text">
I have my eyes on you since the very first day of your on earth ie 28nov2009 🐣<br>
I love you lovleen ❤️🙈<br><br>
<b>Will you be mine forever?</b>
</div>

<button id="yes">YES 💖</button>
<button id="no">NO 🙄</button>

<div id="msg"></div>

<!-- popup -->
<div id="popup">
  <div id="popupBox">
    <h3>❤️</h3>
    <p>Thank you for loving me 🥰😊</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
const gallery = document.getElementById("gallery");
const shapes = ["circle", "heart", "hexagon"];

for (let i = 1; i <= 77; i++) {
  const div = document.createElement("div");
  div.className = "tile " + shapes[i % shapes.length];
  div.style.backgroundImage = `url("Zip-${i}.jpg")`;
  gallery.appendChild(div);
}

/* petals */
function createPetal() {
  const petal = document.createElement("div");
  petal.innerHTML = "🌸";
  petal.style.position = "fixed";
  petal.style.left = Math.random() * 100 + "vw";
  petal.style.top = "-20px";
  petal.style.fontSize = Math.random() * 20 + 15 + "px";
  petal.style.opacity = Math.random();
  petal.style.animation = `fall ${Math.random()*5+5}s linear`;
  document.body.appendChild(petal);
  setTimeout(() => petal.remove(), 10000);
}
setInterval(createPetal, 200);

/* firecracker */
function firework() {
  const fw = document.createElement("div");
  fw.innerHTML = "🎆";
  fw.style.position = "fixed";
  fw.style.left = Math.random() * 100 + "vw";
  fw.style.top = Math.random() * 100 + "vh";
  fw.style.fontSize = Math.random()*30+20+"px";
  document.body.appendChild(fw);
  setTimeout(()=>fw.remove(),1500);
}

/* buttons */
document.getElementById("no").onclick = () => {
  document.getElementById("msg").innerText =
  "❌ Option not available, try harder NCC babe 😎";
};

document.getElementById("yes").onclick = () => {
  document.getElementById("msg").innerText = "";
  document.getElementById("popup").style.display = "flex";

  // vibration (works mainly on Android)
  if (navigator.vibrate) {
    navigator.vibrate([200,100,200,100,300]);
  }

  setInterval(firework,300);
};

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

<style>
@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>

</body>
</html>
