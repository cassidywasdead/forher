<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Lovleen ❤️</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:
   linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.7)),
   url("bg1.jpg") no-repeat center center fixed;
  background-size:cover;
  font-family:Segoe UI,sans-serif;
  color:white;
  text-align:center;
  overflow-x:hidden;
}

h1{margin-top:20px;text-shadow:0 0 15px pink;}

#gallery{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
 gap:15px;
 padding:30px;
 z-index:2;
 position:relative;
}

.tile{width:90px;height:90px;background-size:cover;background-position:center;}
.circle{border-radius:50%}
.heart{clip-path:path("M45 15 C45 -5,0 -5,0 25 C0 55,45 80,45 80 C45 80,90 55,90 25 C90 -5,45 -5,45 15 Z")}
.hexagon{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%)}

button{padding:12px 25px;font-size:18px;margin:15px;border:none;border-radius:30px;cursor:pointer;z-index:2;position:relative;}
#yes{background:hotpink;color:white}
#no{background:#333;color:white}

#popup{
 position:fixed;inset:0;
 background:rgba(0,0,0,.6);
 display:none;
 justify-content:center;
 align-items:center;
 z-index:5;
}
#popupBox{
 backdrop-filter:blur(10px);
 background:rgba(255,182,193,.2);
 border-radius:20px;
 padding:25px;
 width:280px;
 box-shadow:0 0 25px pink;
}
#popupBox button{width:100%;background:hotpink;color:white;border-radius:20px;padding:10px}

canvas{position:fixed;inset:0;pointer-events:none;z-index:1}

.petal{
 position:fixed;
 top:-50px;
 width:30px;
 pointer-events:none;
 animation:fall linear forwards;
}

@keyframes fall{
 to{transform:translate(var(--wind),110vh) rotate(360deg);}
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<h1>Every piece still shows you ❤️</h1>
<div id="gallery"></div>

<div>
I have my eyes on you since the very first day of your on earth ie 28nov2009 🐣<br>
I love you lovleen ❤️🙈<br><br>
<b>Will you be mine forever?</b>
</div>

<button id="yes">YES 💖</button>
<button id="no">NO 🙄</button>
<div id="msg"></div>

<div id="popup">
 <div id="popupBox">
  <p>Thank you for loving me, I love you ❤️</p>
  <button onclick="closePopup()">I love you more 💖</button>
 </div>
</div>

<audio id="fireSound" src="fireworks1.mp3" loop></audio>

<script>
// gallery
const gallery=document.getElementById("gallery");
const shapes=["circle","heart","hexagon"];
for(let i=1;i<=77;i++){
 let d=document.createElement("div");
 d.className="tile "+shapes[i%3];
 d.style.backgroundImage=`url("Zip-${i}.jpg")`;
 gallery.appendChild(d);
}

// REAL ROSE PETALS (IMAGE)
function petal(){
 let p=document.createElement("img");
 p.src="rosepetal.PNG";   // 👈 .PNG FIX
 p.className="petal";
 p.style.left=Math.random()*100+"vw";
 p.style.width=Math.random()*20+20+"px";
 p.style.opacity=Math.random();
 p.style.animationDuration=Math.random()*4+6+"s";
 p.style.setProperty("--wind",(Math.random()*200-100)+"px");
 document.body.appendChild(p);
 setTimeout(()=>p.remove(),12000);
}
setInterval(petal,250);

// buttons
document.getElementById("no").onclick=()=>{
 document.getElementById("msg").innerText="❌ Option not available 😎";
};

document.getElementById("yes").onclick=()=>{
 document.getElementById("popup").style.display="flex";
 document.getElementById("fireSound").play();
 if(navigator.vibrate) navigator.vibrate([300,150,300]);
 startFireworks();
};

function closePopup(){document.getElementById("popup").style.display="none";}

// FIREWORKS (REAL PARTICLES)
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;canvas.height=innerHeight;
onresize=()=>{canvas.width=innerWidth;canvas.height=innerHeight};

let particles=[];
function boom(){
 let x=Math.random()*canvas.width;
 let y=Math.random()*canvas.height*0.5;
 for(let i=0;i<120;i++){
  particles.push({
   x,y,
   vx:(Math.random()-0.5)*6,
   vy:(Math.random()-0.5)*6,
   life:100,
   color:`hsl(${Math.random()*360},100%,60%)`
  });
 }
}

function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 particles.forEach((p,i)=>{
  p.x+=p.vx; p.y+=p.vy; p.life--;
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,2.5,0,Math.PI*2);
  ctx.fill();
  if(p.life<=0) particles.splice(i,1);
 });
 requestAnimationFrame(animate);
}
animate();

function startFireworks(){
 setInterval(boom,800);
}
</script>

</body>
</html>
