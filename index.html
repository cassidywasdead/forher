<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Lovleen ❤️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #2b1055, #000);
  overflow-x: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 20px;
  text-shadow: 0 0 12px pink;
}

#gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 15px;
  padding: 30px;
  justify-items: center;
}

.tile {
  width: 90px;
  height: 90px;
  background-size: cover;
  background-position: center;
  transition: 0.3s;
}

.circle { border-radius: 50%; }

.heart {
  clip-path: path("M45 15 C45 -5, 0 -5, 0 25 C0 55, 45 80, 45 80 C45 80, 90 55, 90 25 C90 -5, 45 -5, 45 15 Z");
}

.hexagon {
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
}

.tile:hover {
  transform: scale(1.15);
  box-shadow: 0 0 15px pink;
}

#text {
  margin: 40px 20px;
  font-size: 20px;
  text-shadow: 0 0 10px hotpink;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  margin: 15px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: hotpink;
  color: white;
}

#no {
  background: #444;
  color: white;
}

#msg {
  font-size: 22px;
  margin-top: 20px;
  color: pink;
}
</style>
</head>

<body>

<h1>Every piece still shows you ❤️</h1>

<div id="gallery"></div>

<div id="text">
I have my eyes on you since the very first day of your on earth ie 28nov2009 🐣<br>
I love you lovleen ❤️🙈<br><br>
<b>Will you be mine forever?</b>
</div>

<button id="yes">YES 💖</button>
<button id="no">NO 🙄</button>

<div id="msg"></div>

<script>
const gallery = document.getElementById("gallery");
const shapes = ["circle", "heart", "hexagon"];

for (let i = 1; i <= 77; i++) {
  const div = document.createElement("div");
  div.className = "tile " + shapes[i % shapes.length];
  div.style.backgroundImage = `url("Zip-${i}.jpg")`;
  gallery.appendChild(div);
}

/* petals */
function createPetal() {
  const petal = document.createElement("div");
  petal.innerHTML = "🌸";
  petal.style.position = "fixed";
  petal.style.left = Math.random() * 100 + "vw";
  petal.style.top = "-20px";
  petal.style.fontSize = Math.random() * 20 + 15 + "px";
  petal.style.opacity = Math.random();
  petal.style.animation = `fall ${Math.random()*5+5}s linear`;
  document.body.appendChild(petal);
  setTimeout(() => petal.remove(), 10000);
}
setInterval(createPetal, 200);

/* firecracker */
function firework() {
  const fw = document.createElement("div");
  fw.innerHTML = "🎆";
  fw.style.position = "fixed";
  fw.style.left = Math.random() * 100 + "vw";
  fw.style.top = Math.random() * 100 + "vh";
  fw.style.fontSize = Math.random()*30+20+"px";
  document.body.appendChild(fw);
  setTimeout(()=>fw.remove(),1500);
}

/* buttons */
document.getElementById("no").onclick = () => {
  document.getElementById("msg").innerText =
  "❌ Option not available, try harder NCC babe 😎";
};

document.getElementById("yes").onclick = () => {
  document.getElementById("msg").innerText =
  "Thank you for loving me 🥰😊";
  setInterval(firework,300);
};
</script>

<style>
@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>

</body>
</html>
